<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{{ cookiecutter.project_name }} interactive</title>
    <style>
      body { max-width: 72rem; margin: auto; }
      sz-{{ cookiecutter.project_slug }}-example { --sz-accent: #7b003c; }
    </style>
  </head>
  <body>
    <sz-{{ cookiecutter.project_slug }}-example id="example"></sz-{{ cookiecutter.project_slug }}-example>
    <script type="module" src="./story.js"></script>
    <script>
      document.querySelector('#example').data = [
        { period: 1, value: 3 },
        { period: 2, value: 8 },
        { period: 3, value: 5 },
        { period: 4, value: 13 }
      ];
    </script>
  </body>
</html>
