meta:
  name: SAMIZDATA

color:
  palette:
    samizdata-background: "#faf9f6"
    samizdata-accent: "#9f1853"
    cool-gray-10: "#f2f4f8"
    cool-gray-30: "#dde1e6"
    cool-gray-70: "#525252"
    cool-gray-100: "#161616"
    blue-60: "#0f62fe"
    green-50: "#24a148"
    orange-50: "#ff832b"
    red-50: "#fa4d56"
  foreground: cool-gray-100
  background: samizdata-background
  primary: samizdata-accent
  secondary: cool-gray-70
  tertiary: cool-gray-30
  success: green-50
  info: blue-60
  warning: orange-50
  danger: red-50

typography:
  fonts:
    - family: Roboto
      source: google
    - family: Roboto Slab
      source: google
    - family: Roboto Mono
      source: google
  base:
    family: Roboto
    size: 1rem
    line-height: 1.6
  headings:
    family: Roboto Slab
    weight: 600
  monospace:
    family: Roboto Mono
